<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#251e18">
  <title>You’re offline · Deldiet Coffee</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#251e18;color:#fff6e6;font-family:system-ui,sans-serif}
    main{min-height:100svh;display:grid;align-content:center;justify-items:start;padding:clamp(24px,9vw,150px);border-top:12px solid #ff6038}
    b{font-size:14px;letter-spacing:.06em}
    h1{margin:32px 0 18px;font-size:clamp(60px,10vw,148px);letter-spacing:-.085em;line-height:.9}
    h1 em{font:italic 400 .94em/1.1 Georgia,serif;letter-spacing:-.065em;color:#e6f65b}
    p{font-size:17px;line-height:1.55;max-width:39ch;margin:0}
    a{display:inline-block;color:#211b16;background:#e6f65b;border-radius:30px;padding:14px 24px;text-decoration:none;font-weight:650;margin-top:28px}
    a:focus-visible{outline:3px solid white;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <b>Deldiet Coffee</b>
    <h1>A pause<br><em>between cups.</em></h1>
    <p>You’re offline. Reconnect to browse the coffee, open your Passport or send a request.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
